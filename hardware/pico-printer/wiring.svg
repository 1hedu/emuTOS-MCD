<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880" font-family="Helvetica, Arial, sans-serif">
<style>
  .bg   { fill:#ffffff }
  .box  { fill:#f7f7f9; stroke:#3a3a42; stroke-width:2 }
  .box2 { fill:#eef3f8; stroke:#2b5f8e; stroke-width:2 }
  .warn { fill:#fdf0ed; stroke:#b23a2a; stroke-width:2 }
  .note { fill:#f4f4f6; stroke:#9a9aa4; stroke-width:1.5 }
  .t    { fill:#15151a; font-size:15px }
  .ttl  { fill:#15151a; font-size:22px; font-weight:bold }
  .sub  { fill:#55555f; font-size:14px }
  .hd   { fill:#15151a; font-size:16px; font-weight:bold }
  .m    { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:14px; fill:#15151a }
  .ms   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12.5px; fill:#40404a }
  .sig  { stroke:#2b5f8e; stroke-width:2.5; fill:none }
  .gnd  { stroke:#2e7d32; stroke-width:2.5; fill:none }
  .dang { stroke:#b23a2a; stroke-width:2.5; fill:none }
  .dash { stroke:#8a8a94; stroke-width:2; fill:none; stroke-dasharray:6 5 }
  .pin  { fill:#ffffff; stroke:#3a3a42; stroke-width:1.5 }
</style>
<rect class="bg" x="0" y="0" width="1280" height="880"/>

<text class="ttl" x="40" y="42">PRN: — Mega Drive EXT port to a PCL 3 printer</text>
<text class="sub" x="40" y="66">EmuTOS Bconout(0) → iofw uart_send() → EXT pin 6 at 4800 8N1 → RP2040 → Centronics → DeskJet 340</text>

<!-- ===================== Genesis EXT ===================== -->
<rect class="box" x="40" y="100" width="250" height="250" rx="6"/>
<text class="hd" x="56" y="126">Mega Drive Model 1</text>
<text class="t"  x="56" y="146">EXT connector (port C)</text>
<rect x="60" y="162" width="210" height="76" rx="34" fill="#ffffff" stroke="#3a3a42" stroke-width="2"/>
<circle class="pin" cx="90"  cy="186" r="9"/><text class="ms" x="86"  y="191">1</text>
<circle class="pin" cx="128" cy="186" r="9"/><text class="ms" x="124" y="191">2</text>
<circle class="pin" cx="166" cy="186" r="9"/><text class="ms" x="162" y="191">3</text>
<circle class="pin" cx="204" cy="186" r="9"/><text class="ms" x="200" y="191">4</text>
<circle class="pin" cx="242" cy="186" r="9"/><text class="ms" x="238" y="191">5</text>
<circle class="pin" cx="109" cy="216" r="9"/><text class="ms" x="105" y="221">6</text>
<circle class="pin" cx="147" cy="216" r="9"/><text class="ms" x="143" y="221">7</text>
<circle class="pin" cx="185" cy="216" r="9"/><text class="ms" x="181" y="221">8</text>
<circle class="pin" cx="223" cy="216" r="9"/><text class="ms" x="219" y="221">9</text>
<text class="m" x="56" y="268">6  TL = TxD   console out</text>
<text class="m" x="56" y="292">9  TR = RxD   console in</text>
<text class="m" x="56" y="316">8  GND</text>
<text class="m" x="56" y="340">5  +5V        not needed</text>

<!-- ===================== level shift ===================== -->
<rect class="warn" x="352" y="100" width="250" height="250" rx="6"/>
<text class="hd" x="368" y="126" fill="#b23a2a">5 V → 3.3 V — mandatory</text>
<text class="t"  x="368" y="146">The RP2040 is not 5 V tolerant.</text>

<text class="ms" x="368" y="188">from pin 6</text>
<line class="dang" x1="368" y1="200" x2="416" y2="200"/>
<rect x="416" y="188" width="48" height="24" fill="#ffffff" stroke="#b23a2a" stroke-width="2"/>
<text class="ms" x="424" y="205">1.8k</text>
<line class="dang" x1="464" y1="200" x2="516" y2="200"/>
<circle cx="516" cy="200" r="4.5" fill="#b23a2a"/>
<line class="sig" x1="516" y1="200" x2="602" y2="200"/>
<text class="ms" x="530" y="190">3.24 V</text>
<line class="dang" x1="516" y1="200" x2="516" y2="230"/>
<rect x="492" y="230" width="48" height="24" fill="#ffffff" stroke="#b23a2a" stroke-width="2"/>
<text class="ms" x="500" y="247">3.3k</text>
<line class="gnd" x1="516" y1="254" x2="516" y2="282"/>
<line class="gnd" x1="500" y1="282" x2="532" y2="282"/>
<line class="gnd" x1="506" y1="289" x2="526" y2="289"/>
<line class="gnd" x1="512" y1="296" x2="520" y2="296"/>

<text class="ms" x="368" y="322">5 × 3.3/(1.8+3.3) = 3.24 V</text>
<text class="ms" x="368" y="340">~1 mA. A shifter is nicer.</text>

<!-- ===================== Pico ===================== -->
<rect class="box2" x="664" y="100" width="250" height="620" rx="8"/>
<text class="hd" x="682" y="128">Raspberry Pi Pico</text>
<text class="t"  x="682" y="148">RP2040 · pico_printer.uf2</text>
<line x1="664" y1="162" x2="914" y2="162" stroke="#2b5f8e" stroke-width="1.5"/>
<text class="m"  x="682" y="200">GP17  UART RX</text>
<text class="m"  x="682" y="232">GP16  UART TX</text>
<text class="m"  x="682" y="264">GND</text>
<text class="ms" x="682" y="290">uart0 · 4800 8N1</text>
<text class="ms" x="682" y="308">IRQ-fed, 4096 B ring</text>
<line x1="664" y1="322" x2="914" y2="322" stroke="#2b5f8e" stroke-width="1.5"/>
<text class="m" x="682" y="356">GP0..GP7  D0..D7</text>
<text class="m" x="682" y="388">GP8       /STROBE</text>
<text class="m" x="682" y="420">GP9       BUSY</text>
<text class="m" x="682" y="452">GP10      /ACK</text>
<text class="m" x="682" y="484">GP11      /INIT</text>
<text class="m" x="682" y="516">GND</text>
<line x1="664" y1="538" x2="914" y2="538" stroke="#2b5f8e" stroke-width="1.5"/>
<text class="hd" x="682" y="566">Onboard LED</text>
<text class="ms" x="682" y="590">2 blinks   booted</text>
<text class="ms" x="682" y="610">solid      printing</text>
<text class="ms" x="682" y="630">4 fast     bad checksum</text>
<text class="ms" x="682" y="662">No blink at all means the</text>
<text class="ms" x="682" y="680">bytes never arrived. Four</text>
<text class="ms" x="682" y="698">means they arrived wrong.</text>

<!-- ===================== Centronics ===================== -->
<rect class="box" x="1010" y="100" width="230" height="430" rx="6"/>
<text class="hd" x="1026" y="126">DeskJet 340</text>
<text class="t"  x="1026" y="146">Centronics 36, PCL 3</text>
<line x1="1010" y1="160" x2="1240" y2="160" stroke="#3a3a42" stroke-width="1.5"/>
<text class="m" x="1026" y="196">2..9   D0..D7</text>
<text class="m" x="1026" y="228">1      /STROBE</text>
<text class="m" x="1026" y="260">11     BUSY</text>
<text class="m" x="1026" y="292">10     /ACK</text>
<text class="m" x="1026" y="324">31     /INIT</text>
<text class="m" x="1026" y="356">19..30 GND</text>
<line x1="1010" y1="378" x2="1240" y2="378" stroke="#3a3a42" stroke-width="1.5"/>
<text class="ms" x="1026" y="404">Tie as the printer expects,</text>
<text class="ms" x="1026" y="422">usually to inactive:</text>
<text class="m"  x="1026" y="450">36     /SELECT-IN</text>
<text class="m"  x="1026" y="476">14     /AUTOFEED</text>
<text class="ms" x="1026" y="508">Compatibility mode only.</text>

<!-- ===================== EXT -> shifter -> Pico ===================== -->
<path class="dang" d="M 290 268 L 322 268 L 322 200 L 352 200"/>
<text class="ms" x="296" y="260" fill="#b23a2a">5 V</text>
<path class="sig" d="M 602 200 L 656 200"/>
<polygon points="664,200 654,195 654,205" fill="#2b5f8e"/>

<!-- GP16 backpressure, routed under the shifter -->
<path class="dash" d="M 300 292 L 322 292 L 322 384 L 636 384 L 636 232 L 664 232"/>
<polygon points="290,292 302,287 302,297" fill="#8a8a94"/>
<text class="ms" x="340" y="376">GP16 → pin 9 backpressure — unused</text>

<!-- ground, routed under both -->
<path class="gnd" d="M 290 316 L 336 316 L 336 406 L 650 406 L 650 264 L 664 264"/>
<text class="ms" x="352" y="424" fill="#2e7d32">common ground</text>

<!-- ===================== Pico -> Centronics ===================== -->
<path class="sig" d="M 914 356 L 930 356 L 930 196 L 1002 196"/>
<polygon points="1010,196 1000,191 1000,201" fill="#2b5f8e"/>
<path class="sig" d="M 914 388 L 946 388 L 946 228 L 1002 228"/>
<polygon points="1010,228 1000,223 1000,233" fill="#2b5f8e"/>
<path class="sig" d="M 1010 260 L 962 260 L 962 420 L 922 420"/>
<polygon points="914,420 924,415 924,425" fill="#2b5f8e"/>
<path class="sig" d="M 1010 292 L 978 292 L 978 452 L 922 452"/>
<polygon points="914,452 924,447 924,457" fill="#2b5f8e"/>
<path class="sig" d="M 914 484 L 994 484 L 994 324 L 1002 324"/>
<polygon points="1010,324 1000,319 1000,329" fill="#2b5f8e"/>
<path class="gnd" d="M 914 516 L 1002 516 L 1002 356 L 1010 356"/>

<!-- ===================== notes ===================== -->
<rect class="note" x="40" y="452" width="562" height="146" rx="6"/>
<text class="hd" x="58" y="478">Before you solder</text>
<text class="t"  x="58" y="504">Pin numbers here are the connector's own, as moulded on it.</text>
<text class="t"  x="58" y="528">D-sub numbering mirrors between plug and socket, so count on the</text>
<text class="t"  x="58" y="552">part in your hand rather than off this picture — and confirm pin 8</text>
<text class="t"  x="58" y="576">is ground with a meter before power goes anywhere near GP17.</text>

<rect class="note" x="40" y="622" width="562" height="176" rx="6"/>
<text class="hd" x="58" y="648">Bring-up, before the printer exists</text>
<text class="t"  x="58" y="674">A 4800-8N1 USB-serial adapter on pin 6, level-shifted, sees</text>
<text class="m"  x="58" y="704">a5 00 00 17 "EmuTOS on the Mega CD\r\n" ea</text>
<text class="t"  x="58" y="732">from progs/prntest.c — 26 bytes. That trailing 00 is a real</text>
<text class="t"  x="58" y="756">checksum, not padding: the sum comes to 1536. GEOS's own is</text>
<text class="m"  x="58" y="784">a5 00 00 0a "GEOS-PRINT" f2</text>

<text class="ms" x="40" y="830">Frame: [0xA5][mode][len_hi][len_lo][payload][checksum], checksum = 8-bit sum of mode + len + payload. Mode 0 text, mode 1 raster.</text>
<text class="ms" x="40" y="850">One frame is one page — mode 0 form-feeds. 4800 baud is the Sega maximum: ~480 B/s, so a 4 KB page is about nine seconds on the wire.</text>
<text class="ms" x="40" y="870">Pin functions from hardware/pico-printer/main.c and its README; our half of the path is docs/printer.md.</text>
</svg>
